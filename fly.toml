# Fly.io config for the `dropshipkitchen` app (created from the Fly dashboard).
app = "dropshipkitchen"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/store.db"
  STORE_NAME = "Chef Supply"
  SUPPLIER_MODE = "mock"
  SITE_URL = "https://dropshipkitchen.fly.dev"

# Persistent disk for the SQLite database (Fly creates the `data` volume on first deploy).
[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"

# Only route traffic once the store answers (first boot also pushes the schema).
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/shop"
